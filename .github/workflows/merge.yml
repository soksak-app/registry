name: merge
# build-machine: skip build reason=the validate workflow built the index of the pull request
# build-machine: skip test reason=the validate workflow checked the pull request
# build-machine: skip smoke reason=the registry is data; the applications read it on their first run

# 검사가 성공한 pull request 를 merge 하고 index 를 게시한다(core docs/spec/registry.md#merge-and-publication).
# 검사한 commit 이 pull request 의 head 로 남아 있고 항목 파일만 바뀌었을 때만 merge 한다.
on:
  workflow_run:
    workflows: [validate]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  merge:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: validation
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Merge
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKED_RUN_HEAD: ${{ github.event.workflow_run.head_sha }}
        run: |
          number=$(jq -r '.number' pull.json)
          head=$(jq -r '.head' pull.json)
          test "$number" -gt 0
          test "$head" = "$CHECKED_RUN_HEAD"
          gh pr view "$number" --repo "$GITHUB_REPOSITORY" --json files --jq '.files[].path' > files
          if grep -vE '^(plugins|sidecars)/[^/]+\.json$' files; then
            echo "pull request $number changes paths that only registry maintainers change" >&2
            exit 1
          fi
          gh pr merge "$number" --repo "$GITHUB_REPOSITORY" --squash --match-head-commit "$head"

  publish:
    needs: merge
    uses: ./.github/workflows/publish.yml
    permissions:
      contents: read
      pages: write
      id-token: write
