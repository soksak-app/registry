name: publish
# build-machine: skip test reason=the ci and validate workflows test the registry before it reaches main
# build-machine: skip smoke reason=the registry is data; the applications read it on their first run

# commit 한 항목 파일로 index 를 만들어 GitHub Pages 에 배포한다(core docs/spec/registry.md#merge-and-publication).
on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

env:
  # 검사와 게시의 sok 은 이 core 커밋의 것이다. 새 형식(release, releases)을 읽는 core release 가 아직 없으므로 그 형식을 읽는 core 의 커밋을 쓰고, 그 release 가 나오면 release 의 tag 로 바꾼다(core 체크리스트 F117.8).
  CORE_REF: da5ab0f22ea336e42353e1efdbcf2f2aefa398c4

jobs:
  publish:
    runs-on: ubuntu-26.04-arm
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: registry
      - uses: actions/checkout@v4
        with:
          repository: soksak-app/core
          ref: ${{ env.CORE_REF }}
          path: core
      - uses: actions/setup-go@v5
        with:
          go-version-file: core/packages/sok/wailsv3/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version-file: registry/.node-version
      - name: Build sok
        run: go build -C core/packages/sok/wailsv3 -o "$RUNNER_TEMP/sok" ./src/cmd/sok
      - name: Check the core releases
        run: node registry/scripts/validate.mjs --check-core registry/core.json
      - name: Build the index
        run: |
          make -C registry build SOK="$RUNNER_TEMP/sok"
          mkdir site
          cp registry/index.json site/index.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
