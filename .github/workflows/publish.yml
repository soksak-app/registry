name: publish
# build-machine: skip test reason=the ci and validate workflows test the registry before it reaches main
# build-machine: skip smoke reason=the registry is data; the applications read it on their first run

# commit 한 항목 파일로 index 를 만들어 GitHub Pages 에 배포한다(core docs/spec/registry.md#merge-and-publication).
on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

env:
  # The sok of this core release builds the index; its installer reads the release form that the registry lists.
  CORE_RELEASE: v0.0.29

jobs:
  publish:
    runs-on: macos-15
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: registry
      - uses: actions/setup-node@v4
        with:
          node-version-file: registry/.node-version
      - name: Download sok
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$CORE_RELEASE" --repo soksak-app/core --pattern "soksak-${CORE_RELEASE#v}-darwin-arm64-tauriv2.zip" --dir "$RUNNER_TEMP"
          ditto -x -k "$RUNNER_TEMP/soksak-${CORE_RELEASE#v}-darwin-arm64-tauriv2.zip" "$RUNNER_TEMP/core"
          ln -s "$RUNNER_TEMP/core/soksak.app/Contents/MacOS/sok" "$RUNNER_TEMP/sok"
      - name: Check the core releases
        run: node registry/scripts/validate.mjs --check-core registry/core.json
      - name: Build the index
        run: |
          make -C registry build SOK="$RUNNER_TEMP/sok"
          mkdir site
          cp registry/index.json site/index.json
      - name: Check the listed core versions
        run: node registry/scripts/check-listed-cores.mjs --index registry/index.json --releases https://github.com/soksak-app/core/releases/download
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
