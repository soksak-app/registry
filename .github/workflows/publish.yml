name: publish
# build-machine: skip test reason=the ci and validate workflows test the registry before it reaches main
# build-machine: skip smoke reason=the registry is data; the applications read it on their first run

# commit 한 항목 파일로 index 를 만들어 GitHub Pages 에 배포한다(core docs/spec/registry.md#merge-and-publication).
on:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  # 검사와 게시의 sok 은 이 core release 의 것이다.
  CORE_RELEASE: v0.0.3

jobs:
  publish:
    runs-on: ubuntu-26.04-arm
    environment:
      name: github-pages
    steps:
      # merge 가 부른 실행에서도 merge 한 뒤의 main 을 받는다.
      - uses: actions/checkout@v4
        with:
          ref: main
          path: registry
      - uses: actions/checkout@v4
        with:
          repository: soksak-app/core
          ref: ${{ env.CORE_RELEASE }}
          path: core
      - uses: actions/setup-go@v5
        with:
          go-version-file: core/packages/sok/wailsv3/go.mod
      - name: Build sok
        run: go build -C core/packages/sok/wailsv3 -o "$RUNNER_TEMP/sok" ./src/cmd/sok
      - name: Build the index
        run: |
          make -C registry build SOK="$RUNNER_TEMP/sok"
          mkdir site
          cp registry/index.json site/index.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
