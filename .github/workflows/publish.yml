name: publish
# build-machine: skip test reason=the ci and validate workflows test the registry before it reaches main
# build-machine: skip smoke reason=the registry is data; the applications read it on their first run

# commit 한 항목 파일로 index 를 만들어 GitHub Pages 에 배포한다(core docs/spec/registry.md#merge-and-publication).
on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

env:
  # The sok of this core release builds the index; its installer reads the release form that the registry lists.
  CORE_RELEASE: v0.0.47

jobs:
  publish:
    runs-on: macos-15
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: registry
      - uses: actions/setup-node@v4
        with:
          node-version-file: registry/.node-version
      - name: Download sok
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$CORE_RELEASE" --repo soksak-app/core --pattern "soksak-${CORE_RELEASE#v}-darwin-arm64-tauriv2.zip" --dir "$RUNNER_TEMP"
          ditto -x -k "$RUNNER_TEMP/soksak-${CORE_RELEASE#v}-darwin-arm64-tauriv2.zip" "$RUNNER_TEMP/core"
          ln -s "$RUNNER_TEMP/core/soksak.app/Contents/MacOS/sok" "$RUNNER_TEMP/sok"
      - name: Check the core releases
        run: node registry/scripts/validate.mjs --check-core registry/core.json
      - name: Build the index
        run: |
          make -C registry build SOK="$RUNNER_TEMP/sok"
          mkdir site
          cp registry/index.json site/index.json
      - name: Check the listed core versions
        run: node registry/scripts/check-listed-cores.mjs --index registry/index.json --releases https://github.com/soksak-app/core/releases/download
      - id: upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      # deploy-pages finds the artifact by listing the artifacts of the run by name; that list is empty for an artifact that the
      # upload finalized less than a second earlier and holds two after a re-run of the job, and deploy-pages takes no artifact id.
      # This step deploys the uploaded artifact by the id that the upload returns, with the requests that deploy-pages makes.
      - name: Deploy the uploaded artifact
        uses: actions/github-script@v9
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        with:
          script: |
            const { data: deployment } = await github.request("POST /repos/{owner}/{repo}/pages/deployments", {
              ...context.repo,
              artifact_id: Number(process.env.ARTIFACT_ID),
              pages_build_version: context.sha,
              oidc_token: await core.getIDToken(),
            });
            const id = deployment.status_url.split("/").pop();
            core.info(`Created the Pages deployment ${id} of artifact ${process.env.ARTIFACT_ID}`);
            const failed = {
              deployment_failed: "the deployment failed",
              deployment_content_failed: "the artifact could not be deployed",
              deployment_cancelled: "the deployment was cancelled",
              deployment_lost: "the deployment reported no final status",
            };
            // The Pages API reports the state of a deployment only on request and sends no event, so the step reads it every
            // 5 seconds, for at most 10 minutes as deploy-pages does.
            const end = Date.now() + 600000;
            for (;;) {
              await new Promise((resolve) => setTimeout(resolve, 5000));
              const { data } = await github.request("GET /repos/{owner}/{repo}/pages/deployments/{id}", { ...context.repo, id });
              core.info(`Pages deployment ${id}: ${data.status}`);
              if (data.status === "succeed") break;
              if (failed[data.status]) throw new Error(`Pages deployment ${id}: ${failed[data.status]} (${data.status})`);
              if (Date.now() > end) throw new Error(`Pages deployment ${id}: no final status after 10 minutes, last ${data.status}`);
            }
