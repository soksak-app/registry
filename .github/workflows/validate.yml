name: validate
# build-machine: skip build reason=the registry has no build of its own; the check builds the index of the pull request
# build-machine: skip smoke reason=the registry is data; the applications read it on their first run

# pull request 의 항목을 검사한다(core docs/spec/registry.md#check). 읽기 권한만 가지며, base branch 의 script 로
# pull request 의 파일을 데이터로 읽고 pull request 의 파일은 실행하지 않는다.
on: pull_request

permissions:
  contents: read

env:
  # The sok of this core release builds the index; its installer reads the release form that the registry lists.
  CORE_RELEASE: v0.0.29

jobs:
  validate:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: head
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: base/.node-version
      - name: Download sok
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$CORE_RELEASE" --repo soksak-app/core --pattern "soksak-${CORE_RELEASE#v}-darwin-arm64-tauriv2.zip" --dir "$RUNNER_TEMP"
          ditto -x -k "$RUNNER_TEMP/soksak-${CORE_RELEASE#v}-darwin-arm64-tauriv2.zip" "$RUNNER_TEMP/core"
          ln -s "$RUNNER_TEMP/core/soksak.app/Contents/MacOS/sok" "$RUNNER_TEMP/sok"
      - name: Check the pull request
        env:
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: node base/scripts/validate.mjs --base base --head head --author "$AUTHOR" --sok "$RUNNER_TEMP/sok"
      # The index of the pull request is built from its data files with the sok of the core release; no file of the pull request runs.
      - name: Check the listed core versions
        run: |
          registry="$RUNNER_TEMP/registry"
          mkdir "$registry"
          for path in plugins sidecars packs revoked.json core.json; do
            if [ -e "head/$path" ]; then cp -R "head/$path" "$registry/"; fi
          done
          "$RUNNER_TEMP/sok" registry build "$registry"
          node base/scripts/check-listed-cores.mjs --index "$registry/index.json" --releases https://github.com/soksak-app/core/releases/download
